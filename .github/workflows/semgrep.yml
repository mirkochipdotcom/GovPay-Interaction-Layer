name: Semgrep

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: '0 5 * * 1'  # lunedi 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 214 findings pre-esistenti sul codebase attuale (verificato 2026-09-06):
      # bloccare l'intero scan romperebbe ogni PR. Su pull_request usiamo scan
      # diff-aware (--baseline-commit) — blocca solo i findings introdotti dal
      # diff, il debito esistente resta tracciato via SARIF nel tab Security.
      # Su push/schedule scan completo, sempre report-only (continuous monitoring).
      - name: Run Semgrep (diff-aware, bloccante) · pull_request
        if: github.event_name == 'pull_request'
        run: |
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --sarif --output=semgrep.sarif \
            --error

      - name: Run Semgrep (scan completo, report-only) · push/schedule
        if: github.event_name != 'pull_request'
        run: |
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output=semgrep.sarif

      - name: Upload SARIF to GH Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
